<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 塔罗牌占卜</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="starfield"></div>
    
    <div class="container">
        <!-- 占卜表单部分 -->
        <div class="divination-section" id="divinationForm">
            <div class="header">
                <h1>✨ 神秘塔罗占卜 ✨</h1>
                <p class="subtitle">让塔罗牌为你揭示答案</p>
            </div>

            <div class="form-wrapper">
                <div class="input-group">
                    <label for="question">请输入你的问题：</label>
                    <textarea 
                        id="question" 
                        class="question-input" 
                        placeholder="例如：我最近的事业运如何？"
                        rows="3"
                    ></textarea>
                </div>

                <button id="divinationBtn" class="btn-divination">
                    <span>开始占卜</span>
                </button>
            </div>
        </div>

        <!-- 卡牌翻转区域 -->
        <div class="cards-section" id="cardsSection" style="display: none;">
            <h2>选择的塔罗牌</h2>
            <div class="cards-container">
                <div class="card-wrapper">
                    <div class="card" id="card-0">
                        <div class="card-front">
                            <div class="card-inner">🌙</div>
                        </div>
                        <div class="card-back">
                            <div class="card-pattern"></div>
                        </div>
                    </div>
                </div>

                <div class="card-wrapper">
                    <div class="card" id="card-1">
                        <div class="card-front">
                            <div class="card-inner">⭐</div>
                        </div>
                        <div class="card-back">
                            <div class="card-pattern"></div>
                        </div>
                    </div>
                </div>

                <div class="card-wrapper">
                    <div class="card" id="card-2">
                        <div class="card-front">
                            <div class="card-inner">✨</div>
                        </div>
                        <div class="card-back">
                            <div class="card-pattern"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 占卜结果区域 -->
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-header">
                <h2>占卜结果</h2>
            </div>

            <!-- 选中的牌 -->
            <div class="selected-cards">
                <div class="card-info" id="cardInfo-0"></div>
                <div class="card-info" id="cardInfo-1"></div>
                <div class="card-info" id="cardInfo-2"></div>
            </div>

            <!-- AI 占卜解读 -->
            <div class="divination-result">
                <h3>AI 占卜解读</h3>
                <div class="result-text" id="resultText">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>AI 占卜师正在为你解读...</p>
                    </div>
                </div>
            </div>

            <!-- 重新开始按钮 -->
            <button id="restartBtn" class="btn-restart">
                重新开始占卜
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
